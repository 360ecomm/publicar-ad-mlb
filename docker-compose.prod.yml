# Compose de PRODUCAO. O de desenvolvimento (`docker-compose.yml`) continua
# valendo e nao e sobrescrito por este — os dois convivem no repo.
#
# Diferencas deliberadas em relacao ao de dev:
#   - imagem construida com Dockerfile.prod (multi-stage, non-root)
#   - nenhum bind mount de codigo: o que roda e o que foi assado na imagem
#   - postgres e redis SEM `ports:` — alcancaveis so pela rede interna
#   - backend publicado apenas em 127.0.0.1, para o Nginx do host fazer proxy
#   - sem pgadmin e sem frontend
#
# CUIDADO com o nome do projeto. O Compose deriva o nome do diretorio, que e o
# MESMO para este arquivo e para o de dev. Rodar sem `-p` na maquina de
# desenvolvimento faz o Compose convergir o projeto de dev para esta
# definicao: derruba pgadmin e frontend e recria backend/worker/beat com a
# imagem de producao. Sempre isole com `-p`:
#
#   docker compose -p publicaradmlb-prod -f docker-compose.prod.yml up -d --build
#
# Na VPS isso e inofensivo (nao ha stack de dev la), mas o habito evita o
# acidente aqui.
#
# TETO DE MEMORIA — por que cada servico tem `mem_limit`:
# A VPS de destino tem 2 vCPU, 7.8Gi de RAM e ZERO swap, e ja divide a maquina
# com Postgres do host, MariaDB e o app de etiquetas de outro cliente. Sem
# swap, estourar a memoria nao degrada: o OOM killer do kernel escolhe uma
# vitima na hora, e ela pode ser o processo do vizinho, nao o nosso. O
# `mem_limit` transforma "derrubei o app de outro cliente" em "meu container
# reiniciou", que e uma falha nossa, contida e visivel.
#
# Os valores saem de medicao real dos containers ociosos (backend 141MiB,
# worker 131MiB, beat 42MiB, postgres 39MiB, redis 12MiB), com folga para o
# pico. Teto somado: 2.4Gi, deixando ~3.8Gi livres na VPS.
#
# Subir:
#   docker compose -f docker-compose.prod.yml up -d --build
# Migrations (passo manual e deliberado, nunca automatico no boot):
#   docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
# Diagnostico pos-deploy:
#   docker compose -f docker-compose.prod.yml exec backend pytest -q

services:

  # ── Banco de dados ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # 512M: medicao ociosa deu 39MiB, mas o teto real e o `shared_buffers`
    # (128MB no default do postgres:16) somado a work_mem por conexao. 512M
    # cobre o default com folga sem reservar RAM que a VPS nao tem sobrando.
    mem_limit: 512m
    # Sem `ports:` de proposito. O `ufw` NAO filtra portas publicadas via
    # Docker: publicar 5432 aqui exporia o banco na internet mesmo com o
    # firewall fechado. Os outros servicos alcancam pelo DNS interno do
    # compose (`postgres:5432`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache e fila ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data_prod:/data
    # 256M. ATENCAO: o redis aqui nao tem `maxmemory` configurado, entao ele
    # cresce ate o teto do container e ai e morto pelo OOM — levando a fila do
    # Celery junto. Com `result_expires=86400` os resultados ficam 24h na
    # memoria. 256M e folgado para o volume atual, mas se a fila crescer, o
    # certo e configurar `maxmemory` no redis, nao so subir este numero.
    mem_limit: 256m
    # Sem `ports:` — mesma razao do postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Publicado SO no loopback: quem fala com esta porta e o Nginx do host,
    # via proxy reverso. `"8010:8000"` (sem o 127.0.0.1) abriria em todas as
    # interfaces e furaria o ufw, porque o Docker escreve as proprias regras
    # de NAT antes das do firewall.
    # 8010 evita as portas ja documentadas deste projeto: 8001 (backend dev),
    # 5433, 6379, 3000, 5050.
    ports:
      - "127.0.0.1:8010:8000"
    # 512M para os 2 workers uvicorn. Medicao ociosa: 141MiB com 1 processo.
    # A API e leve — nao processa imagem, so fala com banco/Redis e enfileira.
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Trava explicita: `Settings.environment` tem default "development", e
      # `main.py` so desliga o /docs quando o valor NAO e "development".
      # Setar aqui garante o Swagger fechado mesmo que o .env de producao
      # esqueca a variavel — nao dependemos de alguem lembrar.
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # 1G — o teto mais alto da stack, e o unico servico que merece. E aqui que
    # o Pillow abre imagem: uma 1200x1200 RGB sao ~4.3MB de pixel cru, e o
    # pipeline mantem varias copias vivas ao mesmo tempo (foto bruta baixada,
    # variante do motor, normalizada, card renderizado), vezes a concorrencia.
    # Medicao ociosa foi 131MiB; o resto e folga para o pico.
    mem_limit: 1g
    # Sem `ports:` — worker nao atende ninguem de fora, so consome fila.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # concurrency=2 casado com os 2 vCPU da VPS. Estava 4, herdado do compose
    # de dev, onde nao havia vizinho para prejudicar. Em 2 vCPU, 4 workers de
    # imagem so aumentam troca de contexto e pico de memoria sem entregar mais
    # vazao — o gargalo e CPU/IO, nao numero de processos.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q default,images,ai,publish

  # ── Celery Beat (agendador) ──────────────────────────────
  # Desde 2026-09-10 o beat TEM trabalho: `celery_app.py` agenda
  # `check-pending-raw-photos` e `check-pending-ai-engine` a cada 15 min, que
  # retomam listings parados em `pending_raw_photos` (fotos chegaram ao
  # bucket) e `pending_ai_engine` (motor OpenAI voltou). Desligar este
  # servico NAO da erro em lugar nenhum: os standbys simplesmente nunca mais
  # sao retomados sozinhos, so pelos endpoints manuais. Nao e candidato a
  # sair da stack por memoria.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # 128M: o beat so ENVIA duas mensagens a cada 15 min; quem executa as
    # tarefas e o celery_worker. Medido em producao em 2026-09-11, ja com as
    # duas tarefas agendadas: 42.69MiB (33% do teto). Teto baixo de
    # proposito: se este container crescer, e sintoma de bug, nao de carga.
    mem_limit: 128m
    # Sem `ports:`.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # O schedule sobrevive a recriacao do container. Rodando non-root, o
      # caminho precisa pertencer ao appuser — /app e do root na imagem.
      - celerybeat_data_prod:/home/appuser/celerybeat
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/home/appuser/celerybeat/celerybeat-schedule

volumes:
  postgres_data_prod:
  redis_data_prod:
  celerybeat_data_prod:
