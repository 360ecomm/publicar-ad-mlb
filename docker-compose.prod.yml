# docker-compose.prod.yml — stack de produção do ads na VPS-B (srv1985744, https://ads.360ecomm.com.br)
#
# ESTE ARQUIVO É O QUE RODA EM PRODUÇÃO. O servidor lê o clone em /srv/src/ads e roda:
#   docker compose -f /srv/src/ads/docker-compose.prod.yml --project-directory /srv/apps/ads ...
# via /usr/local/bin/ads-deploy.sh. Padrões da máquina, rollback e regra do refresh token: /srv/DEPLOY.md.
#
#   código  : ${ADS_SRC} = /srv/src/ads   (clone git; o build lê daqui — nunca servido pelo Nginx).
#             ADS_SRC vem do .env de /srv/apps/ads (o Compose lê o .env do diretório do projeto para interpolar).
#   config  : /srv/apps/ads               (--project-directory: .env + redis.conf; nada disso entra na imagem nem no git)
#   portas  : 127.0.0.1:3001 frontend, 127.0.0.1:8000 backend -> Nginx (ads.360ecomm.com.br). Em /srv/PORTAS.md
#   nomes   : hífen em tudo que é de sistema; banco `ads`, role `ads_user` (renomeados de publicar_ad_mlb/mlb_user em 2026-09-18)
#
# UMA imagem para backend, celery-worker e celery-beat (ads-backend). Só o serviço `backend` tem
# `build:`; worker e beat usam `image: ads-backend` + `pull_policy: never`. Assim é IMPOSSÍVEL
# rebuildar um e esquecer os outros (lição da VPS-A, ver /srv/DEPLOY.md): `docker compose build`
# gera a imagem uma vez e `up -d --force-recreate` recria os três.
#
# `name: ads` fixa o nome do projeto: os volumes são ads_postgres-data, ads_redis-data e
# ads_celerybeat-data, e a rede ads_default. Mudar o nome do projeto = perder o banco de vista.
#
# Migrations NÃO rodam no boot (CMD é só uvicorn). Passo manual e deliberado:
#   docker compose -f /srv/src/ads/docker-compose.prod.yml --project-directory /srv/apps/ads run --rm backend alembic upgrade head
#
# Histórico: até 2026-09-17 este arquivo descrevia a VPS-A (-p publicar-ad-mlb, portas 8010/8011); de
# 2026-09-17 a 2026-09-18 o compose real viveu só no servidor (/srv/apps/ads/docker-compose.yml) e foi
# trazido para cá sem mudança de comportamento (ensaio por diff de `docker compose config`).
name: ads

services:
  postgres:
    image: postgres:16-alpine
    container_name: ads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ads-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    mem_limit: 256m
    healthcheck:
      # a senha vai por variável de ambiente só do processo redis-cli, nunca por argumento
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ${ADS_SRC}/backend
      dockerfile: Dockerfile.prod
    image: ads-backend
    container_name: ads-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: ads-backend
    pull_policy: never
    container_name: ads-celery-worker
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q default,images,ai,publish

  celery-beat:
    image: ads-backend
    pull_policy: never
    container_name: ads-celery-beat
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - celerybeat-data:/home/appuser/celerybeat
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/home/appuser/celerybeat/celerybeat-schedule

  frontend:
    build:
      context: ${ADS_SRC}/frontend
      dockerfile: Dockerfile.prod
    image: ads-frontend
    container_name: ads-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    mem_limit: 512m
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  celerybeat-data:
